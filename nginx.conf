server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
      text/plain
      text/css
      text/javascript
      text/xml
      application/javascript
      application/json
      application/xml
      application/rss+xml
      application/atom+xml
      application/manifest+json
      application/xhtml+xml
      image/svg+xml
      font/woff
      font/woff2;

    # SEO files: serve from root and never cache aggressively
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        types { } default_type application/manifest+json;
    }

    # Long cache for fingerprintable static assets (1 year, immutable)
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Shorter cache for CSS/JS (revisitable)
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML: no aggressive cache so updates roll out immediately
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Main location — SPA-like fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden / sensitive files
    location ~ /\.(?!well-known) { deny all; }
    location = /Dockerfile { deny all; }
    location = /.dockerignore { deny all; }
    location = /.gitignore { deny all; }
    location ~ /\.git { deny all; }

    # Security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Custom error pages fall back to index for SPA-style apps
    error_page 404 /index.html;
}
